name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier le Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  image:
    needs: dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Nom de l'image (en minuscules, obligatoire pour GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/factures:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Construire
        run: docker build -t "$IMAGE" app
      - name: Scanner les vulnérabilités
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL "$IMAGE"
      - name: Publier sur GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  infrastructure:
    name: Analyse de l'infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Installer les outils d'analyse
        run: pip install ansible-core ansible-lint yamllint

      - name: Installer les collections Ansible
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Créer un mot de passe factice pour le coffre
        run: mkdir -p ~/.ansible && echo factice > ~/.ansible/vault_pass_homelab

      - name: Vérifier les fichiers YAML
        run: yamllint -d relaxed .

      - name: Analyser les rôles et le playbook
        working-directory: ansible
        run: ansible-lint

      - name: Vérifier les règles d'alerte Prometheus
        run: |
          V=$(grep '^prometheus_version' ansible/inventories/lab/group_vars/all/versions.yml | cut -d'"' -f2)
          docker run --rm -v "$PWD/ansible/roles/observability/files/rules:/r:ro" \
            --entrypoint promtool "prom/prometheus:$V" check rules /r/alerts.yml
