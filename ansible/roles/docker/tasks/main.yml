- name: Installer les prérequis du dépôt Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    update_cache: true
    cache_valid_time: 3600

- name: Ajouter le dépôt Docker officiel
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: https://download.docker.com/linux/debian/gpg
    state: present
  notify: Rafraîchir la liste des paquets

- name: Appliquer tout de suite le rafraichissemnt si le dépôt vient d'être ajouté
  ansible.builtin.meta: flush_handlers

- name: Installer Docker Engine et le plugin Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    update_cache: true
    cache_valid_time: 3600

- name: Configurer le démon Docker
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Redémarrer docker

- name: Démarrer Docker et l'activer au démarrage
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Filtrage des ports publiés par Docker
  when: docker_user_filter | bool
  block:
    - name: Déposer le script de filtrage DOCKER-USER
      ansible.builtin.template:
        src: docker-user-filter.sh.j2
        dest: /usr/local/sbin/docker-user-filter.sh
        mode: "0750"
      notify: Appliquer le filtrage DOCKER-USER

    - name: Déposer le service systemd du filtrage
      ansible.builtin.copy:
        src: docker-user-filter.service
        dest: /etc/systemd/system/docker-user-filter.service
        mode: "0644"
      notify: Appliquer le filtrage DOCKER-USER

    - name: Activer le filtrage DOCKER-USER au démarrage
      ansible.builtin.systemd_service:
        name: docker-user-filter.service
        enabled: true
        state: started
        daemon_reload: true
