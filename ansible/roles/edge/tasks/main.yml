- name: Créer l'arborescence de la stack
  ansible.builtin.file:
    path: "/opt/edge/{{ item }}"
    state: directory
    mode: "0750"
  loop: ["", dynamic, certs, logs]

- name: Déposer la configuration Traefik
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/opt/edge/{{ item.dest }}"
    mode: "0640"
  loop:
    - { src: compose.yml.j2, dest: compose.yml }
    - { src: traefik.yml.j2, dest: traefik.yml }
    - { src: routes.yml.j2, dest: dynamic/routes.yml }
  notify: Redémarrer Traefik

- name: Déposer le certificat et sa clé (déchiffrée par Vault)
  ansible.builtin.copy:
    src: "{{ edge_pki_dir }}/{{ item }}"
    dest: "/opt/edge/certs/{{ item }}"
    mode: "0640"
  loop: [wildcard.crt, wildcard.key]
  notify: Redémarrer Traefik

- name: Lancer la stack
  community.docker.docker_compose_v2:
    project_src: /opt/edge
    state: present
