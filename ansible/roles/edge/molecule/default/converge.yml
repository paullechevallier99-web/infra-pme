- name: Appliquer les rôles docker et edge
  hosts: all
  become: true
  vars_files:
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../inventories/lab/group_vars/all/versions.yml"
  vars:
    domain: lab.internal
    ips: { apps: 172.31.19.20, obs: 172.31.19.30 }
    edge_listen_ip: 127.0.0.1
    edge_pki_dir: "{{ lookup('env','MOLECULE_PROJECT_DIRECTORY') }}/../../../pki"
  roles:
    - role: docker
    - role: edge
