driver:
  name: docker
platforms:
  - name: debian13-edge
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_VAULT_PASSWORD_FILE: "${HOME}/.ansible/vault_pass_homelab"
verifier:
  name: ansible
