groups:
  - name: disponibilite
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} injoignable sur {{ $labels.instance }}"
      - alert: ServiceProbeFailed
        expr: probe_success == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Le service {{ $labels.instance }} ne répond plus en HTTPS"
      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 21
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Le certificat de {{ $labels.instance }} expire dans moins de 21 jours"

  - name: ressources
    rules:
      - alert: DiskAlmostFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disque {{ $labels.mountpoint }} presque plein sur {{ $labels.host }}"
      - alert: MemoryPressure
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Mémoire utilisée à plus de 90 % sur {{ $labels.host }}"
      - alert: ContainerRestarting
        expr: increase(container_restart_count{name!=""}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Le conteneur {{ $labels.name }} redémarre en boucle sur {{ $labels.host }}"

  - name: sauvegardes
    rules:
      - alert: BackupTooOld
        expr: time() - backup_last_success_timestamp_seconds > 26 * 3600
        labels: { severity: critical }
        annotations:
          summary: "Aucune sauvegarde réussie depuis plus de 26 h (RPO menacé)"
      - alert: BackupMetricMissing
        expr: absent(backup_last_success_timestamp_seconds)
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "Métrique de sauvegarde absente : script jamais lancé ou collecte cassée"
      - alert: RestoreTestTooOld
        expr: time() - restore_last_success_timestamp_seconds > 8 * 86400
        labels: { severity: warning }
        annotations:
          summary: "Aucun test de restauration réussi depuis plus de 8 jours"

  - name: application
    rules:
      - alert: InvoiceQueueBacklog
        expr: factures_queue_length > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Plus de 50 factures en attente depuis 10 minutes"
