- name: Créer les répertoires de la stack et des données
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop: [/opt/backup, /srv/garage/meta, /srv/garage/data]

- name: Déposer la configuration de Garage (elle contient des secrets)
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /opt/backup/garage.toml
    mode: "0600"
  notify: Redémarrer Garage

- name: Déposer le fichier Compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/backup/compose.yml
    mode: "0644"

- name: Lancer la stack
  community.docker.docker_compose_v2:
    project_src: /opt/backup
    state: present
