- name: Attendre que les VM soient prêtes
  hosts: all
  gather_facts: false
  tasks:
    - name: Attendre la connexion SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Attendre la fin de cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

- name: Socle commun sur toutes les VM
  hosts: all
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - common
    - docker
    - agents

- name: Stockage des sauvegardes
  hosts: backup
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - garage

- name: Applications et sauvegardes
  hosts: apps
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - apps
    - role: backup
      tags: [sauvegardes]

- name: Supervision
  hosts: obs
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - observability

- name: Point d'entrée HTTPS
  hosts: edge
  become: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - edge
